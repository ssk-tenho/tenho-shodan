<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>天鳳 三麻段位シミュレーター</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>天鳳 三麻段位ポイントシミュレーション</h2>

<h3>初期設定</h3>
初期段位: <input id="initial_rank" type="number" value="7"><br>
初期pt: <input id="initial_pt" type="number" value="1400"><br>

<h3>特上卓（4〜6段）着順分布</h3>
1着率: <input id="p1_tokujou" type="number" step="0.001" value="0.35"><br>
2着率: <input id="p2_tokujou" type="number" step="0.001" value="0.33"><br>
3着率: <input id="p3_tokujou" type="number" step="0.001" value="0.32"><br>

<h3>三鳳卓（7段〜）着順分布</h3>
1着率: <input id="p1_sanpou" type="number" step="0.001" value="0.34"><br>
2着率: <input id="p2_sanpou" type="number" step="0.001" value="0.35"><br>
3着率: <input id="p3_sanpou" type="number" step="0.001" value="0.31"><br>

<h3>目標設定</h3>
目標段位: <input id="upper_rank" type="number" value="10"><br>
目標pt: <input id="upper_pt" type="number" value="4000"><br>

<h3>シミュレーション設定</h3>
試行数: <input id="trials" type="number" value="10000"><br>
最大半荘数: <input id="max_games" type="number" value="10000"><br>

<button onclick="runSim()">シミュレーション開始</button>

<h3>結果</h3>
<pre id="result"></pre>

<script src="script.js"></script>
</body>
</html>
